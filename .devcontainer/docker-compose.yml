services:
  development:
    build:
      context: .
      args:
        # Set BASE_IMAGE in your environment to use a locally built image instead
        BASE_IMAGE: ${BASE_IMAGE:-likeeighteenbears/build-environment:latest}
        # Written by initialize.sh to .env before each build
        HOST_USER_ID: ${HOST_USER_ID:?Run .devcontainer/initialize.sh first}
        HOST_GROUP_ID: ${HOST_GROUP_ID:?Run .devcontainer/initialize.sh first}
        DOCKER_GROUP_ID: ${DOCKER_GROUP_ID:-}

    volumes:
      - ..:/workspaces/build-environment:cached
      # Builds run on the host's docker daemon
      - /var/run/docker.sock:/var/run/docker.sock

    # Keeps the container running for VS Code to connect to
    command: sleep infinity
