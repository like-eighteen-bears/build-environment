name: Docker Image build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_NAMESPACE: likeeighteenbears
  # Development keeps the original image name so existing consumers (e.g. DDE) are unaffected
  DEVELOPMENT_IMAGE: build-environment
  CI_DESKTOP_IMAGE: build-environment-ci-desktop

jobs:

  build:
    name: Build, test and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Every push gets a sha-<commit> tag, release tags (v1.2.3) get 1.2.3 and 1.2,
      # and latest follows main.
      - name: Generate ci_desktop tags
        id: meta_ci_desktop
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/${{ env.CI_DESKTOP_IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate development tags
        id: meta_development
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/${{ env.DEVELOPMENT_IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Load the images locally first so they can be tested before anything is pushed.
      # development builds on ci_desktop, so its cache export covers both images.
      - name: Build ci_desktop
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci_desktop
          load: true
          tags: ${{ env.CI_DESKTOP_IMAGE }}:test
          cache-from: type=gha

      - name: Build development
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          load: true
          tags: ${{ env.DEVELOPMENT_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test ci_desktop
        run: ./test/smoke-test.sh ${{ env.CI_DESKTOP_IMAGE }}:test ci_desktop

      - name: Smoke test development
        run: ./test/smoke-test.sh ${{ env.DEVELOPMENT_IMAGE }}:test development

      # These reuse the builder's cache from the steps above, so they only push.
      - name: Push ci_desktop
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci_desktop
          push: true
          tags: ${{ steps.meta_ci_desktop.outputs.tags }}
          labels: ${{ steps.meta_ci_desktop.outputs.labels }}

      - name: Push development
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          push: true
          tags: ${{ steps.meta_development.outputs.tags }}
          labels: ${{ steps.meta_development.outputs.labels }}
